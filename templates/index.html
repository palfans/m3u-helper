<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d172a">
    <title>M3U Helper</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="M3U Helper 首页">
                <span class="brand-mark" aria-hidden="true">M3</span>
                <span class="brand-copy">
                    <span class="brand-kicker">MEDIA TOOLKIT</span>
                    <strong>M3U Helper</strong>
                </span>
            </a>
            <div class="topbar-status" id="connectionStatus" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span>准备就绪</span>
            </div>
        </header>

        <main class="page-content">
            <section class="source-card panel" aria-labelledby="sourceTitle">
                <div class="panel-heading">
                    <h2 id="sourceTitle">导入播放列表</h2>
                    <span class="source-state" id="sourceState">等待导入</span>
                </div>
                <form id="m3uForm">
                    <label class="field-label" for="m3uUrl">M3U / M3U8 地址</label>
                    <div class="url-entry">
                        <span class="input-prefix" aria-hidden="true">URL</span>
                        <input type="url" id="m3uUrl" autocomplete="url" placeholder="example.com/playlist.m3u8" title="地址只在当前检查过程中使用">
                        <button type="submit" class="button button-primary" id="parseBtn" title="读取并解析播放列表">
                            <span>解析列表</span>
                            <span aria-hidden="true">→</span>
                        </button>
                    </div>
                    <div class="import-divider"><span>或者</span></div>
                    <label class="file-drop" for="m3uFile">
                        <input type="file" id="m3uFile" accept=".m3u,.m3u8">
                        <span class="file-icon" aria-hidden="true">↑</span>
                        <span class="file-copy">
                            <strong id="fileName">选择本地文件</strong>
                            <small>支持 .m3u / .m3u8 · UTF-8 编码</small>
                        </span>
                        <span class="button button-quiet">浏览文件</span>
                    </label>
                </form>
                <div class="source-footer">
                    <span id="sourceMeta">尚未载入数据</span>
                </div>
            </section>

            <section class="dashboard is-hidden" id="dashboard" aria-labelledby="playlistTitle">
                <div class="dashboard-heading">
                    <div>
                        <h2 id="playlistTitle" title="支持拖动项目调整顺序">播放列表</h2>
                    </div>
                    <div class="action-group" aria-label="播放列表操作">
                        <label class="concurrency-control" for="checkWorkers" title="选择同时检查的地址数量">
                            <span>并发</span>
                            <select id="checkWorkers" aria-label="并发数">
                                <option value="1" selected>1（顺序）</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="5">5</option>
                            </select>
                        </label>
                        <button type="button" class="button button-secondary" id="checkAllBtn" title="按所选并发数检查所有条目">
                            <span class="button-pulse" aria-hidden="true"></span>
                            检查全部
                        </button>
                        <button type="button" class="button button-stop is-hidden" id="stopCheckBtn" title="停止当前检查">
                            停止检查
                        </button>
                        <button type="button" class="button button-quiet is-hidden" id="reportBtn">下载 HTML 报告</button>
                        <button type="button" class="button button-quiet" id="downloadBtn">导出 M3U</button>
                    </div>
                </div>

                <div class="stats-grid" aria-label="检查概览">
                    <article class="stat-card stat-total" title="当前播放列表的总条目数">
                        <span class="stat-label">全部</span>
                        <strong id="summaryTotal">0</strong>
                    </article>
                    <article class="stat-card stat-available" title="探测成功的条目数">
                        <span class="stat-label">可用</span>
                        <strong id="summaryAvailable">0</strong>
                    </article>
                    <article class="stat-card stat-errors" title="探测失败的条目数">
                        <span class="stat-label">不可用</span>
                        <strong id="summaryErrors">0</strong>
                    </article>
                    <article class="stat-card stat-pending" title="尚未完成探测的条目数">
                        <span class="stat-label">待检查</span>
                        <strong id="summaryPending">0</strong>
                    </article>
                </div>

                <div class="progress-panel" id="progressPanel" title="并发数由上方选择决定">
                    <div class="progress-heading">
                        <div>
                            <strong id="progressTitle">准备检查</strong>
                        </div>
                        <strong id="progressLabel">0 / 0</strong>
                    </div>
                    <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
                    <p class="progress-message" id="currentChecking">点击检查全部开始</p>
                </div>

                <div class="playlist-toolbar">
                    <label class="search-field" for="playlistSearch">
                        <span aria-hidden="true">⌕</span>
                        <input type="search" id="playlistSearch" placeholder="搜索标题或地址" autocomplete="off">
                    </label>
                    <label class="filter-field" for="statusFilter">
                        <span>筛选</span>
                        <select id="statusFilter">
                            <option value="all">全部状态</option>
                            <option value="pending">待检查</option>
                            <option value="ok">可用</option>
                            <option value="error">不可用</option>
                        </select>
                    </label>
                    <label class="filter-field" for="groupFilter">
                        <span>分组</span>
                        <select id="groupFilter">
                            <option value="all">全部分组</option>
                        </select>
                    </label>
                    <div class="selection-actions">
                        <span id="selectedCount" class="selected-count">已选 0</span>
                        <button type="button" class="button button-quiet" id="checkSelectedBtn" disabled title="请选择视频后检查">
                            检查选中
                        </button>
                    </div>
                    <span class="visible-count" id="visibleCount">显示 0 条</span>
                </div>

                <div class="playlist" id="playlist" aria-live="polite"></div>
                <div class="empty-state is-hidden" id="emptyState">
                    <span class="empty-icon" aria-hidden="true">⌁</span>
                    <h3>暂无条目</h3>
                </div>
                <div class="empty-state is-hidden" id="filterEmpty">
                    <span class="empty-icon" aria-hidden="true">⌕</span>
                    <h3>没有匹配项</h3>
                </div>
            </section>
        </main>

    </div>

    <dialog class="info-dialog" id="videoInfoModal" aria-labelledby="videoInfoTitle">
        <div class="dialog-card">
            <div class="dialog-header">
                <div>
                    <h2 id="videoInfoTitle">视频信息</h2>
                </div>
                <button type="button" class="icon-button" id="closeModalButton" aria-label="关闭详情">×</button>
            </div>
            <div class="dialog-body" id="videoInfoContent"></div>
        </div>
    </dialog>

    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <noscript>
        <div class="noscript-message">此页面需要启用 JavaScript 才能使用播放列表检查功能。</div>
    </noscript>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
